server:
  port: 8081

spring:
  application:
    name: tc-oficina-os-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://os-db:5432/oficina_os}
    username: ${SPRING_DATASOURCE_USERNAME:oficina_user}
    password: ${SPRING_DATASOURCE_PASSWORD:oficina_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka.oficina-infra.svc.cluster.local:9092}
    consumer:
      group-id: os-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    config-url: /os/v3/api-docs/swagger-config
    url: /os/v3/api-docs
