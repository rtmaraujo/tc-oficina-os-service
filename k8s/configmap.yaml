apiVersion: v1
kind: ConfigMap
metadata:
  name: os-service-config
  namespace: oficina-os
data:
  SPRING_PROFILES_ACTIVE: "k8s"
  SERVER_PORT: "8081"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.oficina-infra.svc.cluster.local:9092"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
  ZIPKIN_ENDPOINT: "http://zipkin.monitoring.svc.cluster.local:9411/api/v2/spans"
  SAGA_TIMEOUT_MINUTES: "30"
